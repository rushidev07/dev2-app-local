/* Tailwind preflight fragment the reference build omitted — border-2 sets
   width only and relies on this for style/colour. Without it the reference
   side computes border-width:0, which is not what Everest renders.
   Scoped via :where() so it contributes ZERO specificity, exactly like real
   preflight — a plain `#old *` selector scores (1,0,0) and would beat the
   utility classes it is meant to sit underneath. */
:where(#old,#oldf,#oldm,#oldb) *,:where(#old,#oldf,#oldm,#oldb) *::before,:where(#old,#oldf,#oldm,#oldb) *::after{border-width:0;border-style:solid;border-color:#e5e7eb}
</style>

<div id="new" class="fs-root">
 <div class="fs-card">
  <a class="fs-card__media"><img class="fs-card__image"></a>
  <div class="fs-card__body">
   <a class="fs-card__title">t</a>
   <p class="fs-card__seller">s</p>
   <div class="fs-card__price">
    <div class="fs-card__deal-label">Deal</div>

     <span class="fs-card__price-current">$10</span>
     <span class="fs-card__price-was">$20</span>

<pre id="out"></pre>
<script>
var PAIRS = [
 ['card',      '#old > div',                    '#new .fs-card',              ['position','display','flex-direction','background-color']],
 ['media',     '#old .block',                   '#new .fs-card__media',       ['display','overflow']],
 ['image',     '#old img',                      '#new .fs-card__image',       ['width','max-width','height','padding-top','object-fit','display']],
 ['body',      '#old .flex-1',                  '#new .fs-card__body',        ['display','flex-direction','flex-grow','padding-left','padding-bottom']],
 ['title',     '#old .line-clamp-2',            '#new .fs-card__title',       ['display','-webkit-line-clamp','overflow','height','margin-top','font-size','font-weight','line-height','color']],
 ['seller',    '#old p',                        '#new .fs-card__seller',      ['margin-top','font-size','line-height','color']],
 ['price',     '#old .AhyPrice',                '#new .fs-card__price',       ['display','flex-direction','min-height','margin-top','overflow']],
 ['deal',      '#old .uppercase',               '#new .fs-card__deal-label',  ['font-size','font-weight','text-transform','color']],
 ['priceRow',  '#old .items-baseline',          '#new .fs-card__price-row',   ['display','align-items','gap']],
 ['current',   '#old .text-2xl',                '#new .fs-card__price-current',['font-size','line-height','font-weight','color']],
 ['was',       '#old .line-through',            '#new .fs-card__price-was',   ['font-size','line-height','color','text-decoration-line']],
 ['from',      '#old .capitalize.text-ahy-red', '#new .fs-card__price-from',  ['font-size','font-weight','text-transform','color']],
 ['optionsBtn','#old .justify-center',          '#new .fs-card__options-btn', ['display','justify-content','align-items','width','padding-top','padding-left','border-top-width','border-top-color','border-top-style','border-radius','background-color','color','font-size','font-weight','text-transform']],
 ['stockBadge','#old .border-ahy-stock-green',  '#new .fs-card__stock-badge', ['padding-top','padding-left','border-top-width','border-top-color','border-radius','background-color','color','font-size','font-weight']],
 ['wishlist',  '#old .rounded-full',            '#new .fs-card__wishlist',    ['position','top','right','z-index','width','height','display','align-items','justify-content','border-top-width','border-top-color','border-radius','background-color','color']],  /* box-shadow omitted: Tailwind emits two transparent ring placeholders before the real layer, so the computed string differs while the rendering is identical */
 ['fGroup',    '#oldf > div',                  '#newf .fs-filter-group',        ['border-top-width','border-top-color','padding-top','padding-bottom']],
 ['fToggle',   '#oldf button.flex',            '#newf .fs-filter-group__toggle',['display','align-items','justify-content','width','margin-bottom']],
 ['fLabel',    '#oldf .font-bold.text-sm',     '#newf .fs-filter-group__label', ['font-size','line-height','font-weight','color']],
 ['fChevron',  '#oldf svg.w-4',                '#newf .fs-filter-group__chevron',['width','height','color']],
 ['fListGap',  '#oldf ul li:nth-child(2)',     '#newf ul li:nth-child(2)',      ['margin-top']],
 ['fOption',   '#oldf label',                  '#newf .fs-filter-option',       ['display','align-items','gap','cursor']],
 ['fCheckbox', '#oldf label > span:first-child','#newf .fs-filter-option > .fs-checkbox', ['width','height','flex-shrink','display','align-items','justify-content','border-top-width','border-top-color','border-radius','background-color']],
 ['fChecked',  '#oldf .chk2',                  '#newf .chk2',                   ['background-color','border-top-color']],
 ['fTick',     '#oldf .tick',                  '#newf .tick',                   ['width','height','color']],
 ['fOptLabel', '#oldf .text-gray-700',         '#newf .fs-filter-option__label',['flex-grow','font-size','line-height','color']],
 ['fOptCount', '#oldf .text-gray-400',         '#newf .fs-filter-option__count',['flex-shrink','font-size','color']],
 ['fMore',     '#oldf button.hover\\:underline','#newf .fs-filter-more',       ['font-size','font-weight','color']],
 ['mShell',    '#oldm .mshell',     '#newm .mshell',     ['position','display','padding-bottom']],
 ['mSideCount','#oldm .msidecount', '#newm .msidecount', ['border-bottom-width','border-bottom-color','padding-bottom','margin-bottom']],
 ['mChips',    '#oldm .mchips',     '#newm .mchips',     ['display','flex-wrap','gap','margin-top','margin-bottom']],
 ['mChip',     '#oldm .mchip',      '#newm .mchip',      ['display','align-items','gap','padding-top','padding-left','border-radius','background-color','color','font-size']],
 ['mClear',    '#oldm .mclear',     '#newm .mclear',     ['font-size','color','text-decoration-line']],
 ['mMain',     '#oldm .mmain',      '#newm .mmain',      ['flex-grow','min-width','padding-top']],
 ['mMenu',     '#oldm .mmenu',      '#newm .mmenu',      ['position','top','right','width','z-index','padding-top','border-top-width','border-top-color','border-radius','background-color']],
 ['mItem',     '#oldm .mitem',      '#newm .mitem',      ['width','text-align','padding-top','padding-left','font-size','line-height']],
 ['mItemLg',   '#oldm .mitemlg',    '#newm .mitemlg',    ['width','text-align','padding-top','padding-left','font-size']],
 ['mNotice',   '#oldm .mnotice',    '#newm .mnotice',    ['margin-bottom','padding-top','padding-left','border-top-width','border-radius','background-color','font-size','color']],
 ['mLink',     '#oldm .mlink',      '#newm .mlink',      ['color','font-weight','cursor']],
 ['mPager',    '#oldm .mpager',     '#newm .mpager',     ['display','align-items','justify-content','gap','padding-top','padding-bottom']],
 ['mPagerBtn', '#oldm .mpbtn',      '#newm .mpbtn',      ['width','height','display','align-items','justify-content','border-top-width','border-top-color','border-radius','background-color']],
 ['mPill',     '#oldm .mpill',      '#newm .mpill',      ['flex-shrink','padding-top','padding-left','border-top-width','border-top-color','border-radius','background-color','color','font-size','font-weight']],
 ['mDrawerHd', '#oldm .mdhead',     '#newm .mdhead',     ['position','top','z-index','display','align-items','justify-content','padding-top','border-bottom-width','background-color']],
 ['mDrawerX',  '#oldm .mdclose',    '#newm .mdclose',    ['width','height','display','align-items','justify-content','font-size','line-height','color']],
 ['mDrawerBd', '#oldm .mdbody',     '#newm .mdbody',     ['flex-grow','padding-left','padding-bottom']],
 ['mZero',     '#oldm .mzero',      '#newm .mzero',      ['font-size','line-height','font-weight','margin-bottom']],
 ['cFooter',   '#oldb .cfoot',  '#newb .cfoot',  ['display','align-items','justify-content']],
 ['cShipping', '#oldb .cship',  '#newb .cship',  ['text-transform','font-size','line-height','font-weight','color']],
 ['cCtaWrap',  '#oldb .cwrap',  '#newb .cwrap',  ['width','max-width','margin-top','padding-top']],
 ['cBtnOut',   '#oldb .cbtno',  '#newb .cbtno',  ['display','justify-content','align-items','gap','width','padding-top','padding-left','border-top-width','border-top-color','background-color','color','font-size','font-weight','text-transform']],
 ['cBtnFill',  '#oldb .cbtnf',  '#newb .cbtnf',  ['background-color','color','border-top-color']],
 ['cIcon',     '#oldb .cicon',  '#newb .cicon',  ['width','height','flex-shrink','object-fit']],
 ['badge',     '#old .absolute',                '#new .fs-card__badge',       ['position','left','top','z-index']]
];
var L=[], pass=0, fail=0;
PAIRS.forEach(function(P){
 var a=document.querySelector(P[1]), b=document.querySelector(P[2]);
 if(!a||!b){L.push('MISSING '+P[0]);fail++;return;}
 var ca=getComputedStyle(a), cb=getComputedStyle(b), bad=[];
 P[3].forEach(function(p){
   var va=ca.getPropertyValue(p), vb=cb.getPropertyValue(p);
   if(va!==vb) bad.push(p+': tw='+va+' | fs='+vb);
 });
 if(bad.length){fail++;L.push('DIFF  '+P[0]);bad.forEach(function(x){L.push('        '+x)});}
 else {pass++;L.push('ok    '+P[0]+'  ('+P[3].length+' props)');}
});
L.push(''); L.push('components matching: '+pass+'   differing: '+fail);
document.getElementById('out').textContent=L.join('\n');
</script></body></html>
